[workspace]
resolver = "3"
members = ["crates/*"]

# One version for the app and every crate: bump it here (and in
# crates/app/ui/package.json). tauri.conf.json takes it from here.
[workspace.package]
version = "0.1.0"

[profile.release]
# Line tables, then the debug info stripped from the binary: backtraces keep
# their function names, and the Linux packages (which, unlike the macOS app,
# would carry the debug info inside the binary) stay small.
debug = "line-tables-only"
strip = "debuginfo"
