[package]
name = "xcvr"
version.workspace = true
edition = "2024"
description = "Transceiver: a desktop client for Transmission"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# The RPC password in the system keychain (macOS Keychain, the Secret Service on Linux); see secrets.rs.
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = { version = "2", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
transmission = { path = "../transmission", features = ["ts"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through gtk; for set_prgname, which names the window for the desktop (main).
glib = "0.18"

[dev-dependencies]
# mock_app, for the poller's tests.
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
