[package]
name = "xcvr"
version.workspace = true
edition = "2024"
description = "Transceiver: a desktop client for Transmission"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# The RPC password in the system keychain (macOS Keychain, the Secret Service on Linux); see secrets.rs.
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# tray-icon: the menu bar / tray icon (tray.rs); image-png: its icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
# Magnet links (the `magnet:` scheme), with single-instance forwarding them on Linux.
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = { version = "2", default-features = false }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
transmission = { path = "../transmission", features = ["ts"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through gtk; for set_prgname, which names the window for the desktop (main).
glib = "0.18"
# Not used directly: holds tauri-plugin-deep-link's rust-ini at 0.21.1. 0.21.3 added fields to
# ParseOption, which deep-link 2.6.2 builds as a struct literal, so it doesn't compile on Linux.
rust-ini = "=0.21.1"

[dev-dependencies]
# mock_app, for the poller's tests.
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
