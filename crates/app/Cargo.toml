[package]
name = "xcvr"
version.workspace = true
edition = "2024"
description = "Transceiver: a desktop client for Transmission"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = { version = "2", default-features = false }
ts-rs = "12.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through gtk; for set_prgname, which names the window for the desktop (main).
glib = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }
