[package]
name = "transmission"
version.workspace = true
edition = "2024"
description = "A typed client for Transmission's RPC (JSON-RPC 2.0, Transmission 4.1 and later)"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
base64 = "0.23.1"
# Plain HTTP on the LAN: no TLS backend. JSON bodies only.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# skip_serializing_none: torrents carry only the fields asked for, and diffs only what changed.
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
thiserror = "2.0.21"
# no-serde-warnings: the number-backed enums use serde(from/into), which ts-rs can't read; they're typed `number` instead.
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }

[features]
# TypeScript bindings for the UI (crates/app/ui/src/bindings), regenerated by `cargo test`.
ts = ["dep:ts-rs"]

[dev-dependencies]
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
